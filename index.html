<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-title" content="Vocal Trainer">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Vocal Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Landscape only: the track name along the top, the buttons in a column on the right. -->
  <button id="title" title="Выбрать песню и партию"><span id="titleText">Vocal Trainer</span></button>
  <nav id="controls">
    <!-- data-label: the words beside the icons on a desktop screen (style.css). -->
    <button id="menu" aria-label="Настройки" data-label="Настройки">☰</button>
    <button id="addBtn" aria-label="Добавить песню" title="Добавить песню" data-label="Добавить">＋</button>
    <button id="viewBtn" title="Ноты или piano roll" data-label="вид">ноты</button>
    <button id="clefBtn" class="chip" aria-label="Ключ" data-label="Ключ">𝄢</button>
    <button id="guide" class="chip" title="Подсказка (пианино / голос)" data-label="Подсказка">♪</button>
    <button id="mic" data-state="off" aria-label="Микрофон" aria-pressed="false" data-label="Микрофон">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
    <button id="play" aria-label="Старт" data-label="Старт">▶</button>
  </nav>

  <canvas id="highway"></canvas>

  <section id="staffWrap">
    <canvas id="staff"></canvas>
  </section>
  <div id="readout">&nbsp;</div>

  <footer id="footer"></footer>
  <div id="status"></div>

  <div id="summary" hidden></div>


  <div id="addMenu" hidden>
    <div class="sheet">
      <button id="addServer">Треки с сервера…</button>
      <p class="note">Песни с домашнего ПК или опубликованные на сайте: выбрать произведение и партию.</p>
      <button id="addDevice">Загрузить с устройства (zip)…</button>
      <p class="note">Пакет песни: chart.json + голос и минус. Песня останется только на этом телефоне.</p>
      <button id="addCancel">Отмена</button>
    </div>
  </div>

  <div id="settings" hidden>
    <div class="sheet">
      <div class="seg">
        <button data-mode="exercise">Упражнение</button>
        <button data-mode="song">Песня</button>
        <button data-mode="free">Свободно</button>
      </div>

      <div id="exBlock">
        <label>Упражнение <select id="kind"></select></label>
        <p id="purpose"></p>
        <label>Стартовая нота <select id="root"></select></label>
        <label>Темп: <span id="bpmVal"></span> bpm <input id="bpm" type="range" min="40" max="160" step="2"></label>
        <label>Длительность
          <select id="length"><option value="short">Коротко (~45 с)</option><option value="medium">Средне (~1:45)</option><option value="long">Долго (~3:30)</option></select>
        </label>
      </div>

      <div id="songBlock">
        <label>Поиск: название, автор, тема или дата письма, слова <span id="searchCount"></span>
          <input id="songSearch" type="search" placeholder="например: трисвятое, 12.10, херувимская" autocomplete="off"></label>
        <label>Произведение <select id="piece"></select></label>
        <p id="pieceInfo"></p>
        <label id="partRow">Партия <select id="part"></select></label>
        <div id="addSong">
          <div class="seg"><button id="addSongBtn" type="button">＋ Добавить песню (zip)…</button>
            <button id="delSongBtn" type="button" hidden>Удалить с телефона</button></div>
          <input id="addSongFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
          <div id="uploadInfo"></div>
        </div>
      </div>

      <label>Вид
        <select id="view">
          <option value="staff">Нотная запись, текст над нотами</option>
          <option value="roll">Piano roll, текст на полосках</option>
        </select>
      </label>
      <label>Нотный стан
        <select id="clef">
          <option value="auto">Авто — по партии и нотам песни</option>
          <option value="bass">Басовый ключ</option>
          <option value="treble">Скрипичный ключ</option>
          <option value="treble8">Скрипичный, октавой ниже (теноровый)</option>
          <option value="grand">Оба (фортепианная система)</option>
        </select>
      </label>
      <label>Подписи нот — везде: на полосках, слева, в строке, под станом
        <select id="labels">
          <option value="fixed">до, ре, ми… (до = C)</option>
          <option value="movable">do, re, mi… от тоники упражнения</option>
          <option value="names">Названия: G3, A3, B3…</option>
        </select>
      </label>
      <label class="row"><input id="names" type="checkbox"> Подписывать ноты под станом</label>
      <label>Точность
        <select id="tolerance"><option value="performance">Выступление (±50¢)</option><option value="practice">Практика (±25¢)</option><option value="precision">Точно (±10¢)</option></select>
      </label>
      <label>Громкость подсказки <input id="guideVol" type="range" min="0" max="1.5" step="0.05"></label>
      <label>Громкость минуса <input id="backVol" type="range" min="0" max="1.5" step="0.05"></label>
      <label>Компенсация задержки: <span id="latVal"></span> мс <input id="latency" type="range" min="0" max="300" step="10"></label>
      <p class="note">Пойте в наушниках: иначе микрофон слышит подсказку из динамика.</p>
      <button id="done">Готово</button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
